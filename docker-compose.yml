name: campushub

services:
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GATEWAY_PORT}:8080"
    networks: [frontend, backend]
    depends_on:
      frontend: { condition: service_healthy }
      api:      { condition: service_healthy }
      minio:    { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

  frontend:
    build: ./app/frontend
    networks: [frontend]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

  api:
    build: ./app/api
    image: campushub-api:1.0.0
    env_file: .env
    networks: [backend, data]
    depends_on:
      db:       { condition: service_healthy }
      redis:    { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio:    { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  worker:
    image: campushub-api:1.0.0
    command: ["node", "src/worker.js"]
    env_file: .env
    networks: [data]
    depends_on:
      api:      { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      disable: true
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "127.0.0.1:15672:15672"
    networks: [data]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  minio:
    image: bitnamilegacy/minio:2025.5.24
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BROWSER: "on"
    volumes:
      - miniodata:/bitnami/minio/data
    ports:
      - "127.0.0.1:9001:9001"
    networks: [backend, data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  mailhog:
    image: mailhog/mailhog
    ports:
      - "127.0.0.1:8025:8025"
    networks: [data]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

networks:
  frontend:
  backend:
  data:

volumes:
  pgdata:
  miniodata: